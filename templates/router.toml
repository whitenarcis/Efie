# efie-router: провайдеры LLM и алиасы моделей.
#
# Как это работает. Бот (Efie) обращается к роутеру как к обычному
# OpenAI-совместимому шлюзу:
#
#     base_url = "http://127.0.0.1:8791/v1"
#     api_key  = "любой"        # роутер ключ бота не проверяет
#     model    = "coder"        # имя алиаса отсюда
#
# Дальше роутер сам решает, у какого провайдера и каким ключом отвечать:
# пробует ключи первого провайдера по порядку, потом ключи второго, и так
# по цепочке алиаса, пока не ответит кто-то.
#
# Ротация ключей липкая: ключ выжимается до отказа (401/403/429/5xx), и
# только после отказа роутер переходит к следующему. Это не round-robin:
# чередование ключей на каждом запросе рвёт кеш контекста у облачных
# провайдеров, и диалог начинает «забывать» сам себя.

[server]
# Слушаем только localhost: перебор ключей наружу отдавать не нужно.
addr = "127.0.0.1:8791"

# --- Провайдеры -------------------------------------------------------------
# url         — база OpenAI-совместимого API (с /v1 на конце).
# api_keys    — ключи провайдера, в порядке предпочтения. Роутер НЕ чередует
#               их на каждом запросе: берёт первый живой и держит его, пока
#               тот не откажет (см. шапку файла).
# timeout_seconds — нижняя граница бюджета попытки. Реальный бюджет шире:
#               к нему прибавляется время на объём вывода (max_tokens).
# proxy       —true: ходить к провайдеру через встроенный sing-box
#               (нужен VLESS-конфиг в proxy.toml). false: напрямую.

[providers.qwencloud]
url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_keys = [
    "sk-первый-ключ",
    "sk-второй-ключ",
    "sk-третий-ключ",
]
timeout_seconds = 60.0
# Из-за рубежа Qwen Cloud бывает недоступен напрямую — оставляем VLESS.
proxy = true

[providers.ollamacloud]
url = "https://ollama.com/v1"
api_keys = [
    "ollama-первый-ключ",
    "ollama-второй-ключ",
]
timeout_seconds = 60.0
# Локальный ollama напрямую: через VLESS заворачивать нечего.
proxy = false

# --- Алиасы моделей ---------------------------------------------------------
# Алиас — это то, что бот просит: model = "coder". chain — упорядоченный
# список кандидатов: сначала выбиваются ВСЕ ключи qwencloud, затем ВСЕ
# ключи ollamacloud. Порядок важен: он определяет, кто отвечает в норме,
# а кто подхватывает запрос, когда у первого кончились ключи.
#
# interactive — потолок ожидания: true (по умолчанию) = 90с на диалог,
# false = 300с для фоновых задач (паритет с efi/llm/timeouts.py).

[aliases.coder]
chain = [
    { provider = "qwencloud", model = "qwen3-coder-plus" },
    { provider = "ollamacloud", model = "qwen3-coder:30b" },
]
interactive = true

[aliases.fast]
chain = [
    { provider = "ollamacloud", model = "gpt-oss:20b" },
    { provider = "qwencloud", model = "qwen3-coder-flash" },
]
interactive = true
