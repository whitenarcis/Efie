[project]
name = "efi"
version = "0.1.0"
description = "Эфи — AI-компаньон для Telegram (userbot), архитектурный гибрид Kuni и текущей реализации Эфи"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings[toml]>=2.2",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "aiofiles>=23.2",
    "pyrofork>=2.0",
    "tgcrypto>=1.2.5",  # ускоряет MTProto-шифрование Pyrogram; необязательна, но настоятельно рекомендуется
    "numpy>=1.26",
    "watchfiles>=0.21",
    "beautifulsoup4>=4.12",
    "qrcode>=7.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "ruff>=0.4",
    "types-aiofiles>=23.2",  # без стабов mypy --strict валится на каждом импорте aiofiles
]
local-embeddings = [
    "fastembed>=0.3",
]

[project.scripts]
efi = "scripts.run:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# Pyrogram не поставляет py.typed и собирает часть модулей динамически
# (pyrogram.errors генерирует классы ошибок на импорте, pyrogram.raw.types —
# из TL-схемы), поэтому под --strict каждый импорт из него выглядел как
# "does not explicitly export attribute". Послабление точечное: касается только
# реэкспорта имён из самого pyrogram, проверка НАШЕГО кода остаётся строгой.
# fastembed — необязательная зависимость (extra `local-embeddings`), её может
# просто не быть в окружении, где гоняется тайпчек.
[[tool.mypy.overrides]]
module = ["pyrogram.*", "fastembed.*"]
implicit_reexport = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["efi*", "scripts*"]
exclude = ["data*", "logs*", "tests*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
