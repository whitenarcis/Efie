# behavior.toml — конфигурация Эфи.
#
# Этот файл лежит в репозитории как ШАБЛОН: все секреты в нём пустые, а
# api_id/owner_id стоят нулями. Ноль и пустая строка — это «не заполнено»:
# приложение проверяет их на старте и падает с внятным списком того, что
# осталось заполнить (см. Settings.validate_ready в efi/config/schema.py).
#
# НЕ ВПИСЫВАЙТЕ СЮДА РЕАЛЬНЫЕ КЛЮЧИ, если работаете с git. Файл отслеживается,
# и заполненные секреты уедут в историю коммитов первым же `git commit -a`
# Держите их в `.env` или в переменных
# окружения `EFI_*` — они имеют приоритет над этим файлом:
#
#     EFI_TELEGRAM__API_ID=12345
#     EFI_TELEGRAM__API_HASH=...
#     EFI_TELEGRAM__OWNER_ID=123456789
#     EFI_LLM_ROLES__MAIN__PRIMARY__API_KEY=sk-...
#
# Приоритет источников конфигурации: явные значения при создании Settings() >
# переменные окружения (EFI_*) > .env > этот файл > значения по умолчанию в схеме.

environment = "production"
debug = false
character_name = "Эфи"

# Часовой пояс Эфи (IANA, например "Europe/Moscow"). По нему считаются тихие
# часы и блок [Время] в системном промпте — то есть то, понимает ли она, что
# сейчас четыре утра, и уместно ли сейчас писать первой.
#
# Пусто — брать пояс системы. На телефоне в Termux это обычно верно, но под
# proot, из cron или на VPS переменная TZ нередко пуста, и процесс живёт по
# UTC: тогда Эфи считает четыре утра полуднем, и заметить это можно только по
# странному поведению. Если запуск не строго «с телефона руками» — впишите
# пояс явно.
timezone = ""

# Личность персонажа для системного промпта. Можно оставить пустым и вместо
# этого положить templates/personality.md — он имеет приоритет и умеет
# hot-reload (см. efi/prompts/loader.py и efi/prompts/builder.py).
personality_prompt = """
Опиши здесь характер, манеру речи и ключевые черты личности.
"""

[telegram]
api_id = 0                        # ← my.telegram.org, целое число без кавычек
api_hash = ""                     # ← my.telegram.org
owner_id = 0                      # ← ваш Telegram user id, целое число

# «Свои» чаты помимо лички владельца. Список РАЗРЕШАЕТ, а не запрещает:
# перечисленное здесь проходит независимо от lockdown_mode, а кто получит
# ответ КРОМЕ них — решает только lockdown_mode. Здесь же перечисляются чаты,
# в которых Эфи вправе писать первой (спонтанные пинги, напоминания).
allowed_chats = []
# Каналы/группы обсуждений, где Эфи участвует как обычный участник сообщества.
# ЯВНЫЙ opt-in: только эти чаты обходят lockdown_mode. Пустой список (по
# умолчанию) = Эфи остаётся персональным ботом и никуда не выходит.
community_chats = []
# КТО ВООБЩЕ ПОЛУЧАЕТ ОТВЕТ:
#   owner_only    — только владелец (по умолчанию: безопасный старт)
#   contacts_only — владелец и контакты аккаунта
#   none          — все, включая незнакомых в ЛС
# Плюс к этому всегда отвечает в allowed_chats и community_chats.
# Фактическую политику Эфи пишет в лог при старте строкой "app: отвечает — ...".
lockdown_mode = "owner_only"      # none | contacts_only | owner_only
check_chats_on_startup = true
can_join_chats = false
can_leave_chats = true

# Основной провайдер инфраструктуры — OmniRoute; три роли (MAIN/FAST/VISION)
# покрывают задачи разной "тяжести". См. efi/config/schema.py::LLMRolesSettings.

# MAIN — ТОЛЬКО живой диалог в чате. Gemma здесь первой сознательно: она
# заметно быстрее отвечает, а задержка ответа собеседнику критичнее качества
# фоновой аналитики. nemotron оставлен резервом (он регулярно упирался в
# таймаут 15с, из-за чего ответ уходил на второй круг по цепочке).
# ---------------------------------------------------------------------------
# МОДЕЛИ
#
# Обязательна ровно ОДНА секция — [llm_roles.main.primary]. Всё остальное
# ниже закомментировано и включается по мере надобности: пока роль не
# задана, она использует модель MAIN, и Эфи полностью работоспособна с одним
# ключом от одного провайдера.
#
# Роли отличаются требованиями, а не «важностью»:
#   MAIN       живой диалог — самая БЫСТРАЯ пригодная модель, человек ждёт
#   FAST       короткие служебные вызовы вне критического пути
#   BACKGROUND дневник, факты, фоновые исследования — можно медленнее и умнее
#   VISION     фотографии и кружки — нужна МУЛЬТИМОДАЛЬНАЯ модель
#
# Про VISION отдельно: если её не задать, фотографии уйдут в модель MAIN, и
# при старте про это будет предупреждение в логе. Текстовая модель на
# картинку ответит ошибкой или выдумкой — если планируете слать фото,
# задайте здесь мультимодальную.
# ---------------------------------------------------------------------------

[llm_roles.main]
degrade_to = "fast"

[llm_roles.main.primary]
base_url = ""
api_key = ""
model = ""
timeout_seconds = 15.0

# Запасная модель на случай 429/5xx/таймаута основной. Не обязательна, но на
# бесплатных тирах выручает чаще, чем кажется.
# [llm_roles.main.fallback]
# base_url = ""
# api_key = ""
# model = ""
# timeout_seconds = 15.0

# [llm_roles.fast.primary]
# base_url = ""
# api_key = ""
# model = ""
# timeout_seconds = 15.0

# Таймаут здесь заведомо больше: эти задачи никого не заставляют ждать в чате.
# [llm_roles.background.primary]
# base_url = ""
# api_key = ""
# model = ""
# timeout_seconds = 45.0

# [llm_roles.vision.primary]
# base_url = ""
# api_key = ""
# model = ""
# timeout_seconds = 60.0

[memory]
plagiarism_threshold = 0.97
min_relatedness = 0.80
max_rag_results = 10
# diary_dir можно не задавать — по умолчанию берётся paths.diary_dir
novelization_min_messages = 3      # короткий, но содержательный обмен — тоже эпизод
novelization_char_limit = 10000
novelization_max_output_tokens = 4096   # по-русски 2048 — это одна запись; отсюда были обрывы в дневнике

# Пульс памяти (efi/memory/pulse.py) — как часто прожитое становится
# воспоминанием. Раньше это происходило РОВНО ОДИН РАЗ в сутки, ночью: день
# переписки до 03:30 не был памятью вообще, а перезапуск до этого часа
# оставлял его неосмысленным. Теперь эпизод разбирается вскоре после того,
# как разговор закончился, вместе с тем, что Эфи делала параллельно (гуглёж,
# комментарии) — это и есть техническая форма «единой личности».
# enabled = false вернёт прежнее поведение (только ночной проход).
[memory_pulse]
enabled = true
check_interval_seconds = 600.0     # как часто смотреть, не закончился ли где эпизод
episode_idle_seconds = 900.0       # 15 минут тишины = разговор закончен, пора запоминать
max_messages_before_flush = 30     # длинный живой разговор разбираем частями, не дожидаясь паузы
min_messages = 3
lookback_hours = 12

[humanizer]
typing_wpm_min = 120
typing_wpm_max = 150
typing_thinking_pause_min_seconds = 1.0
typing_thinking_pause_max_seconds = 2.2
typing_delay_min_seconds = 1.8
typing_delay_max_seconds = 7.0
typo_probability = 0.04
typo_min_text_length = 10
anti_repeat_trigger_max = 0.95
anti_repeat_trigger_avg = 0.85
anti_repeat_max_history = 32

# АВАРИЙНЫЙ потолок бабблов, а не нормальная длина ответа. Раньше стоял на 5
# и работал как настоящий лимит: «поток мыслей» из 8 коротких реплик
# схлопывался в 5, где последнее было слипшимся комом из остатка. Сколько
# бабблов уместно, решает модель по правилам системного промпта.
max_messages_per_burst = 12

# Коротыш (1-3 слова) уходит почти встык. Обычный расчёт по WPM зажат снизу
# typing_delay_min_seconds, из-за чего «а ты?» шло через две секунды, и серия
# коротких реплик растягивалась на полминуты, читаясь как медленный бот.
short_bubble_delay_min_seconds = 0.3
short_bubble_delay_max_seconds = 0.8

# Плавающее окно сборки входящих: каждое новое сообщение сдвигает его вперёд,
# поэтому пачка коротких реплик подряд уходит в LLM одним входом.
debounce_window_min_seconds = 1.5
debounce_window_max_seconds = 2.5

# Раскладка соседних клавиш для опечаток — необязательно, есть встроенный
# дефолт (ЙЦУКЕН+QWERTY) в efi/humanizer/typos.py. Пример переопределения:
# [humanizer.keyboard_neighbors]
# а = ["к", "е", "в", "п", "с", "м"]

# Блок текущего состояния личности (mood/social_distance/sycophancy_protection,
# см. efi/prompts/builder.py) — необязательная секция, есть дефолты. Здесь
# настраивается только жёсткая инструкция подавления угодливости; mood и
# social_distance считаются на лету из efi/memory/beliefs.py и
# efi/behavior/affinity.py.
# [state_vector]
# sycophancy_protection_text = "..."
# relevant_beliefs_limit = 3

# Поведение в сообществе (efi/telegram/comments.py). Сами чаты — в
# telegram.community_chats выше; здесь только насколько охотно вписываться.
# Дефолты сдержанные: участник, комментирующий каждый пост, — это спамер.
[community]
enabled = true
comment_probability = 0.35        # шанс вписаться в подходящий по теме пост
min_delay_seconds = 300.0         # 5 минут: живой человек не отвечает мгновенно
max_delay_seconds = 1800.0        # ...и не позже получаса
thread_scan_interval_seconds = 1800.0
max_replies_per_thread = 1        # одна реплика за заход, а не проход по всей ветке
topic_match_min_score = 0.34

# Цифровое ремесло (efi/dev/): свои проекты, код через кодера и публикация на
# GitHub. ВЫКЛЮЧЕНО по умолчанию не из осторожности вообще, а потому что
# подсистема создаёт публичные репозитории от имени владельца токена и пушит
# туда код, написанный языковой моделью. Такое включают решением, а не молча.
#
# Чтобы включить: enabled = true. Без github_token всё работает локально —
# проекты пишутся, проверяются и коммитятся в data/projects/, но никуда не
# уезжают. Это лучший первый шаг: посмотреть, что она вообще генерирует, до
# того как давать ей доступ к своему GitHub.
#
# Ключ кодера отдельно не нужен: если ключ Groq уже есть в llm_roles, он
# подхватится сам (Settings.resolve_coder_endpoint). Если Groq не используется
# — заполните секцию [dev.coder] ниже своим OpenAI-совместимым эндпоинтом.
[dev]
enabled = false

# МОДЕЛЬ КОДЕРА. Проверьте, что она существует у ВАШЕГО провайдера: имена
# моделей на бесплатных тирах регулярно снимают с обслуживания. Список живых
# моделей Groq:
#     curl -H "Authorization: Bearer $GROQ_KEY" https://api.groq.com/openai/v1/models
# Если модели нет, подсистема не падает и ничего не ломает: первый же запрос
# вернёт ошибку, задача закроется со статусом «не вышло», а причина —
# дословный ответ провайдера — будет в логе и в разделе «Проекты» дашборда.
coder_model = "qwen-2.5-coder-32b"
coder_base_url = "https://api.groq.com/openai/v1"
coder_timeout_seconds = 90.0

# Свой эндпоинт кодера — если он не Groq или ключ отдельный. Заполненная
# секция важнее coder_model/coder_base_url выше.
# [dev.coder]
# base_url = ""
# api_key = ""
# model = ""
# timeout_seconds = 90.0

check_interval_seconds = 3600.0    # как часто смотреть, есть ли работа
self_initiated_probability = 0.25  # шанс затеять СВОЙ проект, когда очередь пуста (0 — только совместные)
max_fix_iterations = 3             # сколько раз возвращать файл кодеру с замечаниями песочницы
progress_probability = 0.5         # шанс рассказать в чате об этапе (не чаще раза в час)
lint_generated_code = true         # гонять ruff по сгенерированному коду, если он есть в системе

# Возвращение к своим проектам: перечитать, поправить, изредка спросить.
review_probability = 0.3           # шанс заглянуть в старый проект, когда новой работы нет (0 — выключить)
review_interval_days = 7.0         # не чаще раза в неделю на один проект
patch_importance_threshold = 0.5   # с какой важности находка становится коммитом
discuss_importance_threshold = 0.8 # с какой важности она пишет ВАМ вопрос по проекту (высоко намеренно)

# Публикация. Токен лучше держать не здесь, а в переменной окружения
# EFI_DEV__GITHUB_TOKEN: этот файл отслеживается git.
# github_token = "ghp_..."                     # PAT с правом repo
# github_owner = ""                            # логин владельца токена (нужен редко)
# github_ssh_key_path = "~/.ssh/efi_ed25519"   # ключ ИМЕННО для неё, а не ваш личный
repo_private = false
push_enabled = true

# Веб-дашборд (efi/dashboard/): подробные логи, состояние всех подсистем и
# самой Эфи, дневник, память, люди, переписка и метрики моделей — в браузере.
# Открывается по http://127.0.0.1:8765/ и одинаково работает и на телефоне, и
# на ПК.
#
# По умолчанию слушает ВСЕ интерфейсы, поэтому дашборд сразу открывается с
# других устройств локальной сети: http://<адрес-машины>:8765/. Точный адрес
# Эфи пишет в лог при старте строкой "dashboard: с других устройств этой сети".
# Ограничить одной машиной — host = "127.0.0.1".
#
# ПРО ДОСТУП: дашборд отдаёт дневник, историю переписки и профили людей. В
# домашней сети за роутером токен не обязателен; если машина смотрит в
# интернет публичным адресом, приложение потребует его само (проверка в
# efi/config/schema.py::DashboardSettings). Задавать лучше переменной
# окружения, а не здесь: этот файл отслеживается git'ом.
#     EFI_DASHBOARD__TOKEN=длинная-случайная-строка
# С токеном заходить по ссылке http://<адрес-машины>:8765/?token=... — он
# один раз ляжет в cookie, дальше ссылка не нужна.
[dashboard]
enabled = true
host = "0.0.0.0"
port = 8765
log_buffer_size = 2000            # сколько последних записей лога держать в памяти
log_level = "INFO"                # DEBUG показывает решения буфера, оркестратора и роутера
metrics_history = 200             # длина ленты последних LLM-вызовов
